name: Build ESP32 Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Arduino Sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=opi
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: ESP32Servo
            - name: Adafruit NeoPixel
            - name: WiFiManager
            - name: ArduinoJson
            - name: ESP32 Async Web Server
            - name: NTPClient
          sketch-paths: |
            - 'ESP32_S3_Camera_Monitor-master'
