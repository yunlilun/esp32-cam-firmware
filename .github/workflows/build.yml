name: Build ESP32 Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Arduino Sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=opi
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: Freenove WS2812 Lib for ESP32
            - name: ESP32Servo
            - name: WiFiManager
          sketch-paths: |
            - 'ESP32_S3_Camera_Monitor-master'

      - name: Find and copy bin files
        run: |
          mkdir -p ${{ github.workspace }}/output
          find ${{ github.workspace }} -name "*.bin" -type f -exec cp {} ${{ github.workspace }}/output/ \; 2>/dev/null || true
          find ${{ github.workspace }} -name "*.elf" -type f -exec cp {} ${{ github.workspace }}/output/ \; 2>/dev/null || true
          find /home/runner -name "*.bin" -type f -exec cp {} ${{ github.workspace }}/output/ \; 2>/dev/null || true
          echo "=== 找到的文件 ==="
          ls -la ${{ github.workspace }}/output/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware
          path: ${{ github.workspace }}/output/
